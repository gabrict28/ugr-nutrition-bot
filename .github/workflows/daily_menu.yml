name: Difusion Menu UGR

on:
  schedule:
    #Se ejecuta a las 08:00 UTC (las 9:00 en España)
    - cron: '0 8 * * 0'    #Domingos
    - cron: '0 8 * * 1-6'  #Lunes a sábado
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar librerias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Se ejecuta: El domingo O si le damos al botón a mano
    - name: Scrapping y análisis nutricional
      if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python scraper_multisede.py
        python analizador_nutricional.py

    # Se ejecuta: El domingo o si lo ejecutamos a mano
    - name: Actualizar los datos obtenidos
      if: github.event.schedule == '0 8 * * 0' || github.event_name == 'workflow_dispatch'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Actualización semanal del menú y la caché [skip ci]" || echo "SIN CAMBIOS"
        git push
      
    # Se ejecuta: De Lunes a Sábado o si lo ejecutamos a mano
    - name: Enviar mensaje al canal de telegram
      if: github.event.schedule == '0 8 * * 1-6' || github.event_name == 'workflow_dispatch'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
      run: python granadito_bot.py
