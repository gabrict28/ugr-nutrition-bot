name: Difusion Menu UGR

on:
  schedule:
    #Se ejecuta a las 09:00 UTC (las 10:00 en España)
    # El formato cron es: Minuto Hora Día Mes Día_Semana
    #1-6 significa de lunes a sábado
    - cron: '0 9 * * 1-6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar librerias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Scraper
      run: python scraper_multisede.py

    - name: Ejecutar Analizador Nutricional
      run: python analizador_nutricional.py
      env:
        BD_APP_ID: ${{ secrets.BD_APP_ID }}
        BD_APP_KEY: ${{ secrets.BD_APP_KEY }}

    - name: Enviar mensaje al canal de telegram
      run: python granadito_bot.py
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
